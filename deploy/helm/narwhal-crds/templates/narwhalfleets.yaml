                      description: "More launch inputs of the engine backend, as the variables discovery reads, such as NARWHAL_ENGINE_BACKEND or NARWHAL_TRANSFER_NET_DEVICES. A name another field of the fleet sets, or that names a credential, is refused."
                      items:
                        type: "object"
                        description: "One launch input"
                        properties:
                          name:
                            type: "string"
                            description: "The variable's name"
                            maxLength: 128
                            pattern: "^NARWHAL_[A-Z0-9_]+$"
                            x-kubernetes-validations:
                              - rule: "!self.matches(r'^NARWHAL_(NODE_[0-9]+_)?(KUBERNETES_.*|KUBECTL|HELM|ENGINE_(IMAGE|MODEL_NAME|PORT|LAUNCH_CONFIG)|ATTEST_PORT|MODEL_(TREE_SHA256|PATH|SHA256|DIR)|URL|ATTESTATION_URL|IP|FABRIC_.*|RDMA_.*|RUN_DIR|ROUTER_.*|TTFT_S|TPOT_S|FIRST_TOKEN_MARGIN_S|PROFILE_.*|CALIBRATION_.*|STAGE_.*|TRIAL_.*|SSH.*|HOSTS|FLEET|LAUNCH_CONFIG|WHEEL.*|REQUIREMENTS.*|TOOLS_COMMIT|DEPLOYMENT_.*|ROLE|POD_.*|NODE_NAME|.*(SECRET|PASSWORD|PASSWD|CREDENTIAL|APIKEY).*|(.*_)?(TOKENS?|KEYS?|CREDS)(_.*)?)$')"
                                message: "another field of the fleet sets this variable, or it names a credential, which belongs in engines.apiKeySecret or controlTokenSecret"
                          value:
                            type: "string"
                            description: "The variable's value"
                            maxLength: 4096
                            pattern: "^[^\\x00-\\x1f\\x7f-\\x9f]*$"
                        required:
                          - "name"
                          - "value"
                      maxItems: 64
                      x-kubernetes-list-type: "map"
                      x-kubernetes-list-map-keys:
                        - "name"
                  required:
                    - "image"
                    - "model"
                    - "modelVolume"
                    - "resources"
                    - "ports"
                    - "nodes"
                slo:
                  type: "object"
                  description: "The fleet's service-level objective, in seconds"
                  properties:
                    ttftS:
                      type: "string"
                      description: "The time-to-first-token target"
                      maxLength: 16
                      pattern: "^(0|[1-9][0-9]{0,6})(\\.[0-9]{1,6})?$"
                      x-kubernetes-validations:
                        - rule: "double(self) > 0.0"
                          message: "must be greater than 0"
                    tpotS:
                      type: "string"
                      description: "The time-per-output-token target"
                      maxLength: 16
                      pattern: "^(0|[1-9][0-9]{0,6})(\\.[0-9]{1,6})?$"
                      x-kubernetes-validations:
                        - rule: "double(self) > 0.0"
                          message: "must be greater than 0"
                    routerOverheadS:
                      type: "string"
                      description: "The router's own share of each request"
                      maxLength: 16
                      pattern: "^(0|[1-9][0-9]{0,6})(\\.[0-9]{1,6})?$"
                  required:
                    - "ttftS"
                    - "tpotS"
                    - "routerOverheadS"
                firstTokenMarginS:
                  type: "string"
                  description: "Seconds the first-token deadline adds to the calibrated candidate"
                  maxLength: 16
                  pattern: "^(0|[1-9][0-9]{0,6})(\\.[0-9]{1,6})?$"
                  x-kubernetes-validations:
                    - rule: "double(self) > 0.0"
                      message: "must be greater than 0"
                profiling:
                  type: "object"
                  description: "The profiling sweep"
                  properties:
                    prefillLens:
                      type: "array"
                      description: "The prompt lengths of the prefill sweep"
                      items:
                        type: "integer"
                        description: "A token count"
                        minimum: 1
                        maximum: 10000000
                      minItems: 1
                      maxItems: 64
                      x-kubernetes-list-type: "atomic"
                    decodeInputLens:
                      type: "array"
                      description: "The input lengths of the decode sweep"
                      items:
                        type: "integer"
                        description: "A token count"
                        minimum: 1
                        maximum: 10000000
                      minItems: 1
                      maxItems: 64
                      x-kubernetes-list-type: "atomic"
                    decodeConcurrency:
                      type: "array"
                      description: "The concurrency levels of the decode sweep"
                      items:
                        type: "integer"
                        description: "A token count"
                        minimum: 1
                        maximum: 10000000
                      minItems: 1
                      maxItems: 64
                      x-kubernetes-list-type: "atomic"
                    warmupRequests:
                      type: "integer"
                      description: "Requests sent before measuring"
                      minimum: 0
                      maximum: 100000
                  required:
                    - "prefillLens"
                    - "decodeInputLens"
                calibration:
                  type: "object"
                  description: "The first-token calibration"
