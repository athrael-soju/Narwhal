                    inputTokens:
                      type: "array"
                      description: "The input lengths calibration measures"
                      items:
                        type: "integer"
                        description: "A token count"
                        minimum: 1
                        maximum: 10000000
                      minItems: 1
                      maxItems: 64
                      x-kubernetes-list-type: "atomic"
                    samples:
                      type: "integer"
                      description: "Samples per group, at least the 100 that preflight accepts"
                      minimum: 100
                      maximum: 100000
                    observationTimeoutS:
                      type: "string"
                      description: "Seconds calibration waits for one observation"
                      maxLength: 16
                      pattern: "^(0|[1-9][0-9]{0,6})(\\.[0-9]{1,6})?$"
                      x-kubernetes-validations:
                        - rule: "double(self) > 0.0"
                          message: "must be greater than 0"
                  required:
                    - "inputTokens"
                    - "observationTimeoutS"
