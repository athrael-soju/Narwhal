                            description: "The network interface that carries the engine's KV transfers"
                            maxLength: 15
                            pattern: "^[^\\s/:\\x00-\\x1f\\x7f-\\x9f]+$"
                          rdma:
                            type: "object"
                            description: "The RDMA port settings of a ucx_rdma engine"
                            properties:
