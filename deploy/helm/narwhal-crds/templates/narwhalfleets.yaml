                                description: "The GID index of the HCA port"
                                minimum: 0
                                maximum: 255
                              roceMode:
                                type: "string"
                                description: "v2 or v1 for RoCE, or infiniband for a native InfiniBand port"
                                maxLength: 16
                                enum:
                                  - "v2"
                                  - "v1"
                                  - "infiniband"
                        required:
                          - "node"
                          - "fabricInterface"
                      minItems: 2
