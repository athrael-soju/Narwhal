                              maxLength: 63
                              pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                            readOnly:
                              type: "boolean"
                              description: "Always true: engines read the model and never write it"
                              default: true
                              x-kubernetes-validations:
                                - rule: "self"
                                  message: "the model volume is mounted read-only"
                            volumeAttributes:
                              type: "object"
                              description: "The driver's volume attributes"
                              maxProperties: 32
                              additionalProperties:
                                type: "string"
