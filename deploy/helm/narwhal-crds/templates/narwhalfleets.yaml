                      required:
                        - "promptTokens"
                        - "handoffsPerS"
                        - "burst"
                        - "transferBudgetS"
                        - "headroom"
                    testPort:
                      type: "integer"
                      description: "The TCP port the fabric test listens on"
                      minimum: 1
                      maximum: 65535
                  required:
                    - "workload"
                    - "testPort"
                routers:
                  type: "object"
                  description: "The router pair"
                  properties:
                    storageClassName:
                      type: "string"
                      description: "The storage class of each router's volume"
                      maxLength: 253
                      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                    size:
                      type: "string"
                      description: "The size of each router's volume"
                      maxLength: 32
                      pattern: "^[0-9]+(\\.[0-9]+)?([KMGTPE]i?)?$"
                    args:
                      type: "array"
                      description: "More narwhal-serve options, such as --lease-ttl 6"
                      items:
                        type: "string"
                        description: "One option or value"
                        maxLength: 256
                        pattern: "^[^\\x00-\\x1f\\x7f-\\x9f]*$"
                      maxItems: 32
                      x-kubernetes-list-type: "atomic"
                  required:
                    - "storageClassName"
                    - "size"
                controlTokenSecret:
                  type: "object"
                  description: "The Secret that holds the routers' control token, which the routes that change membership, trust or lifecycle require: at least 32 random bytes, as 64 hex digits or 43 base64url characters. Name a new Secret to rotate the token."
                  properties:
                    name:
                      type: "string"
                      description: "The Secret's name"
                      maxLength: 253
                      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                    key:
                      type: "string"
                      description: "The key in the Secret"
                      maxLength: 253
                      pattern: "^[-._A-Za-z0-9]+$"
                  required:
                    - "name"
                    - "key"
                haproxy:
                  type: "object"
                  description: "The HAProxy load balancer in front of the routers"
                  properties:
                    replicas:
                      type: "integer"
                      description: "HAProxy pods"
                      minimum: 1
                      maximum: 16
                      default: 1
                    clusterDomain:
                      type: "string"
                      description: "The cluster's DNS domain"
                      maxLength: 253
                      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                      default: "cluster.local"
                timeouts:
                  type: "object"
                  description: "Seconds a stage may run"
                  properties:
                    defaultSeconds:
                      type: "integer"
                      description: "Every stage's limit"
                      minimum: 1
                      maximum: 604800
                    stages:
                      type: "object"
                      description: "One stage's limit, by stage name"
                      properties:
                        access:
                          type: "integer"
                          description: "The access stage's limit"
                          minimum: 1
                          maximum: 604800
                        discover:
                          type: "integer"
                          description: "The discover stage's limit"
                          minimum: 1
                          maximum: 604800
                        engine-prepare:
                          type: "integer"
                          description: "The engine-prepare stage's limit"
                          minimum: 1
                          maximum: 604800
                        install:
                          type: "integer"
                          description: "The install stage's limit"
                          minimum: 1
                          maximum: 604800
                        engine-start:
                          type: "integer"
                          description: "The engine-start stage's limit"
                          minimum: 1
                          maximum: 604800
                        engine-check:
                          type: "integer"
                          description: "The engine-check stage's limit"
                          minimum: 1
                          maximum: 604800
                        cache-capture:
                          type: "integer"
                          description: "The cache-capture stage's limit"
                          minimum: 1
                          maximum: 604800
                        transfer-measure:
                          type: "integer"
                          description: "The transfer-measure stage's limit"
                          minimum: 1
                          maximum: 604800
                        cache-groups:
                          type: "integer"
                          description: "The cache-groups stage's limit"
                          minimum: 1
                          maximum: 604800
                        fabric-budget:
                          type: "integer"
                          description: "The fabric-budget stage's limit"
                          minimum: 1
                          maximum: 604800
                        fabric-edge:
                          type: "integer"
