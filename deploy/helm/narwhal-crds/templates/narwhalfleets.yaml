                                - rule: "self.all(k, k.size() <= 253)"
                                  message: "an attribute name holds at most 253 characters"
                          required:
                            - "driver"
                      x-kubernetes-validations:
                        - rule: "[has(self.persistentVolumeClaim), has(self.hostPath), has(self.nfs), has(self.csi)].filter(set, set).size() == 1"
                          message: "set exactly one of persistentVolumeClaim, hostPath, nfs, csi"
                    resources:
                      type: "object"
                      description: "The device plugins' extended resources, and the engine pods' RuntimeClass"
                      properties:
                        gpu:
                          type: "string"
                          description: "The GPU device plugin's extended resource name, <domain>/<name>"
                          maxLength: 316
                          pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?/[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$"
                          x-kubernetes-validations:
