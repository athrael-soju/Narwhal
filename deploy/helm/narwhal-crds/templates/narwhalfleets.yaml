                          description: "The served model name"
                          maxLength: 256
                          minLength: 1
                          pattern: "^[^\\x00-\\x1f\\x7f-\\x9f]*$"
                        treeSha256:
                          type: "string"
                          description: "The checkpoint's model_tree_sha256"
                          maxLength: 64
                          pattern: "^[0-9a-f]{64}$"
                        file:
                          type: "string"
                          description: "For an engine that serves one model file, its path in the model volume"
