                          x-kubernetes-validations:
                            - rule: "!self.matches(r'^([^/]*\\.)?(kubernetes|k8s)\\.io/')"
                              message: "the kubernetes.io and k8s.io domains are reserved"
                        runtimeClassName:
                          type: "string"
                          description: "The RuntimeClass of nodes whose default container runtime exposes no GPUs"
                          maxLength: 253
                          pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                      required:
                        - "gpu"
                        - "rdma"
                      x-kubernetes-validations:
                        - rule: "self.gpu != self.rdma"
