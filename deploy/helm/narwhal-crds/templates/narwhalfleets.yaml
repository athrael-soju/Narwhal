                          description: "Prompt tokens per KV handoff"
                          minimum: 1
                          maximum: 10000000
                        handoffsPerS:
                          type: "string"
                          description: "Peak remote KV handoffs per second on each directed edge, for each source cache group"
                          maxLength: 16
                          pattern: "^(0|[1-9][0-9]{0,6})(\\.[0-9]{1,6})?$"
                          x-kubernetes-validations:
                            - rule: "double(self) > 0.0"
                              message: "must be greater than 0"
                        burst:
                          type: "integer"
                          description: "Handoffs in a burst"
                          minimum: 1
                          maximum: 1000000
                        transferBudgetS:
                          type: "string"
                          description: "Seconds in which one burst must transfer"
                          maxLength: 16
                          pattern: "^(0|[1-9][0-9]{0,6})(\\.[0-9]{1,6})?$"
                          x-kubernetes-validations:
                            - rule: "double(self) > 0.0"
                              message: "must be greater than 0"
                        headroom:
                          type: "string"
                          description: "Multiplier on the required rate"
                          maxLength: 16
                          pattern: "^(0|[1-9][0-9]{0,6})(\\.[0-9]{1,6})?$"
