{{- if .Values.routers.enabled }}
{{- $domain := printf "routers.%s.svc.%s" .Release.Namespace .Values.haproxy.clusterDomain }}
apiVersion: v1
kind: Service
metadata:
  name: routers
  labels:
    {{- include "narwhal.labels" (dict "root" . "component" "router") | nindent 4 }}
spec:
  clusterIP: None
  # A standby answers /ready with 503 and must still resolve, for its peer and for HAProxy.
  publishNotReadyAddresses: true
  selector:
    {{- include "narwhal.selector" (dict "root" . "component" "router") | nindent 4 }}
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: router
  labels:
    {{- include "narwhal.labels" (dict "root" . "component" "router") | nindent 4 }}
spec:
  serviceName: routers
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "narwhal.selector" (dict "root" . "component" "router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "narwhal.selector" (dict "root" . "component" "router") | nindent 8 }}
    spec:
      enableServiceLinks: false
      # Only the router container mounts the token, below, for the router Lease.
      serviceAccountName: {{ include "narwhal.routerName" . }}
      automountServiceAccountToken: false
      # On several nodes the two routers never share one, so losing a node leaves a router. On
      # one node both still schedule. Tainted nodes the routers cannot run on do not count.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              {{- include "narwhal.selector" (dict "root" . "component" "router") | nindent 14 }}
      containers:
        - name: router
          image: {{ .Values.images.narwhal }}
          # files/router-start.py decides whether this router starts as the primary or as a
          # standby of the other.
          command:
            - python3
            - -I
            - -c
            - {{ .Files.Get "files/router-start.py" | quote }}
            - --fleet
            - {{ printf "/narwhal-state/%s" .Values.routers.fleet | quote }}
            - --host
            - $(NARWHAL_POD_IP)
            - --port
            - "8000"
            - --journal
            - /narwhal-router/journal.jsonl
            - --kubernetes-lease
            - {{ include "narwhal.routerName" . }}
            {{- range .Values.routers.args }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: NARWHAL_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NARWHAL_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NARWHAL_ROUTERS_DOMAIN
              value: {{ $domain }}
            {{- include "narwhal.credentials" . | nindent 12 }}
          # A relative recovery.state_path lies on the router's own volume.
          workingDir: /narwhal-router
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: narwhal-state
              mountPath: /narwhal-state
              readOnly: true
            - name: narwhal-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: router-state
              mountPath: /narwhal-router
      volumes:
        - name: narwhal-state
          persistentVolumeClaim:
            claimName: {{ include "narwhal.stateClaim" . }}
            readOnly: true
        - name: narwhal-api
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
  volumeClaimTemplates:
    - metadata:
        name: router-state
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.routers.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.routers.size }}
{{- end }}
