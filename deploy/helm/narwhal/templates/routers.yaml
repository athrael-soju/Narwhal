{{- $domain := printf "routers.%s.svc.%s" .Release.Namespace .Values.haproxy.clusterDomain }}
apiVersion: v1
kind: Service
metadata:
  name: routers
  labels:
    {{- include "narwhal.labels" (dict "root" . "component" "router") | nindent 4 }}
spec:
  clusterIP: None
  # A standby answers /ready with 503 and must still resolve, for its peer and for HAProxy.
  publishNotReadyAddresses: true
  selector:
    {{- include "narwhal.selector" (dict "root" . "component" "router") | nindent 4 }}
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: router
  labels:
    {{- include "narwhal.labels" (dict "root" . "component" "router") | nindent 4 }}
spec:
  serviceName: routers
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "narwhal.selector" (dict "root" . "component" "router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "narwhal.selector" (dict "root" . "component" "router") | nindent 8 }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: router
          image: {{ .Values.images.narwhal }}
          # Each router starts as a standby of the other, router-0 of router-1 and router-1 of
          # router-0, and the first to find the lease free takes it.
          command:
            - python3
            - -I
            - -c
            - |
              import os, sys
              name = os.environ["NARWHAL_POD_NAME"]
              base, _, index = name.rpartition("-")
              peer = "http://%s-%d.%s:8000" % (base, 1 - int(index), os.environ["NARWHAL_ROUTERS_DOMAIN"])
              argv = [sys.executable, "-I", "-m", "narwhal.cli", *sys.argv[1:]]
              os.execv(sys.executable, [*argv, "--router-id", name, "--standby-of", peer])
            - --fleet
            - /narwhal-state/{{ .Values.routers.fleet }}
            - --host
            - $(NARWHAL_POD_IP)
            - --port
            - "8000"
            - --journal
            - /narwhal-router/journal.jsonl
            - --lease-path
            - /narwhal-lease/router.lease
            {{- range .Values.routers.args }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: NARWHAL_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NARWHAL_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NARWHAL_ROUTERS_DOMAIN
              value: {{ $domain }}
            {{- include "narwhal.credentials" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: narwhal-state
              mountPath: /narwhal-state
              readOnly: true
            - name: narwhal-lease
              mountPath: /narwhal-lease
            - name: router-state
              mountPath: /narwhal-router
      volumes:
        - name: narwhal-state
          persistentVolumeClaim:
            claimName: {{ .Values.engines.stateClaim }}
            readOnly: true
        - name: narwhal-lease
          persistentVolumeClaim:
            claimName: narwhal-lease
  volumeClaimTemplates:
    - metadata:
        name: router-state
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.routers.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.routers.size }}
