# Every value without a default is a deployment input; values.schema.json refuses a release
# that leaves one out. Keep a filled values file in the ignored config/helm/ directory.

images:
  # The Narwhal image by registry digest, <repository>@sha256:<hex>. The routers, the gate
  # Jobs and the engines' attestation sidecars run it.
  narwhal: ""
  # The HAProxy image by registry digest.
  haproxy: ""
  # The image the fabric Jobs run ib_write_bw from, by registry digest. Required with fabric
  # gates.
  fabric: ""

# The engines, as chart_values derives them from every engine's Kubernetes launch directory.
engines: {}

# Engines that start directly from their image, as narwhal dev starts them on a host, with no
# launch plan or attestation; direct_values derives them. They serve on CPUs, for a chart test
# or a development cluster. Their fleet has no engine_contract, so set either engines or these.
directEngines: {}

# The state volume: the fleet file, profiles, calibration and every stage's evidence. The
# engine pods, the routers and the gate Jobs on different nodes share it.
state:
  storageClassName: ""
  size: ""

# The router pair's lease volume. It must support flock, coherent reads and atomic rename
# across nodes.
lease:
  storageClassName: ""
  size: ""

routers:
  # Run the router pair and HAProxy. narwhal deploy --target kubernetes leaves them off until
  # its router-start stage, so the engines and gate Jobs run first.
  enabled: true
  # The fleet file's path on the state volume.
  fleet: ""
  # Each router's own volume, for its journal and state handoff.
  storageClassName: ""
  size: ""
  # More narwhal-serve options, such as ["--lease-ttl", "6"].
  args: []

haproxy:
  replicas: 1
  clusterDomain: cluster.local

# The engines' API credential, which the routers and the gate Jobs that reach engines read
# from a Secret: {"env": <variable>, "secretName": <name>, "key": <key>}.
credentials: {}

# The gate Jobs of the current deployment stage. narwhal deploy --target kubernetes sets them.
gates: []

# The node each engine role's pod runs on, {"engine-1": "<node>"}. narwhal deploy sets it
# with engines: the chart holds each engine pod at a scheduling gate until the run pins it there.
placement: {}

# Prometheus and Grafana, from the configuration files `make observe` uses. Prometheus scrapes
# both routers and finds the engines through the load balancer's /narwhal/targets.
monitoring:
  enabled: false
  prometheus:
    # The Prometheus image by registry digest. Required with monitoring.
    image: ""
    # {"storageClassName", "size"} for a data claim; without it, data lives as long as the pod.
    # storage: {}
    resources: {}
  grafana:
    # The Grafana image by registry digest. Required with monitoring.
    image: ""
    # The rendered dashboard. Pass it with
    # --set-file monitoring.grafana.dashboard=<file from python -m narwhal.observability.stack.chart_dashboard>.
    dashboard: ""
    # The Secret that holds the Grafana admin login: {"secretName", "userKey", "passwordKey"}.
    admin: {}
    # storage: {}
    resources: {}
