# Run Prometheus and Grafana on a router node with `make observe`. The project directory is
# runs/observability under the working directory, which holds the staged mounts.
# Host networking lets Prometheus reach the configured engine addresses.
services:
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    network_mode: host
    restart: always
    labels:
      # make observe sets this from the staged config and rules; a new value recreates Prometheus.
      narwhal.prometheus-config-digest: "${NARWHAL_PROMETHEUS_CONFIG_DIGEST:-}"
    volumes:
      # Startup stages readable configs and targets before Compose launches services.
      - ./mounts/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=${NARWHAL_PROMETHEUS_LISTEN_ADDRESS:-127.0.0.1:9090}

  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    network_mode: host
    restart: always
    environment:
      GF_SERVER_HTTP_ADDR: "${NARWHAL_GRAFANA_BIND_ADDRESS:-127.0.0.1}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # The fleet control console embeds dashboard panels in frames.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      NARWHAL_PROMETHEUS_URL: "${NARWHAL_PROMETHEUS_URL:-http://127.0.0.1:9090}"
      GF_RENDERING_SERVER_URL: "http://${NARWHAL_RENDERER_ADDRESS:-127.0.0.1:8081}/render"
      GF_RENDERING_CALLBACK_URL: "${NARWHAL_GRAFANA_URL:-http://127.0.0.1:3000}/"
      GF_RENDERING_RENDERER_TOKEN: "${NARWHAL_RENDERER_TOKEN:?make observe supplies the renderer token}"
    volumes:
      - ./mounts/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./mounts/grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # Renders panels and dashboards to PNG for Grafana on its listener host.
  renderer:
    image: grafana/grafana-image-renderer:v5.12.5@sha256:76542ccc4c045e5ff9f80f87b25de6fcc71b31222172de5031a8ceba33772ee1
    network_mode: host
    restart: always
    environment:
      SERVER_ADDR: "${NARWHAL_RENDERER_ADDRESS:-127.0.0.1:8081}"
      AUTH_TOKEN: "${NARWHAL_RENDERER_TOKEN:?make observe supplies the renderer token}"

volumes:
  prom-data:
  grafana-data:
