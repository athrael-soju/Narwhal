# The router is scraped on its own port, and engine targets come from the
# generated file. tools/observability/make_targets.py writes
# runs/observability/targets/engines.json from the fleet config. That file
# is gitignored because it contains real engine addresses.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: narwhal-router
    static_configs:
      - targets: ["localhost:8011"]
  - job_name: engines
    file_sd_configs:
      - files: ["/etc/prometheus/targets/engines.json"]
