# Startup writes the deployed router and engine addresses to the gitignored
# discovery files under runs/observability/mounts/prometheus/targets.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: narwhal-router
    file_sd_configs:
      - files: ["/etc/prometheus/targets/router.json"]
  - job_name: engines
    file_sd_configs:
      - files: ["/etc/prometheus/targets/engines.json"]
  # Empty unless NARWHAL_CONTROL_METRICS_URL is set.
  - job_name: fleet-control
    authorization:
      credentials_file: /etc/prometheus/fleet-control-token
    file_sd_configs:
      - files: ["/etc/prometheus/targets/fleet-control.json"]
