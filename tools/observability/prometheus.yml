# Startup writes the deployed router and engine addresses to the gitignored
# discovery files under runs/observability/targets.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: narwhal-router
    file_sd_configs:
      - files: ["/etc/prometheus/targets/router.json"]
  - job_name: engines
    file_sd_configs:
      - files: ["/etc/prometheus/targets/engines.json"]
