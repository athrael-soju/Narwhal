# Alert rules for the Prometheus instance that scrapes `/metrics`.
# Load with `rule_files: [prometheus-alerts.yml]` in prometheus.yml.
groups:
  - name: narwhal
    rules:
      - alert: NarwhalEngineDown
        expr: up{job="engines"} == 0
        for: 30s
        labels:
          severity: page
        annotations:
          summary: "Engine {{ $labels.iid }} stopped answering its scrape"
          description: "Check the engine process and its metrics endpoint. Targets remain monitored until removed from the generated engine targets file."

      - alert: NarwhalEngineEjected
        expr: narwhal_ejected_instances > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "The breaker is holding {{ $value }} engine(s) out of scheduling"
          description: "narwhal_ejected{iid=...} identifies the engines. Inspect /narwhal/lifecycle and breaker evidence. Contracted fleets require inference and identity validation; whole_wave fleets require an operator-managed restart wave."

      - alert: NarwhalRouterDown
        expr: up{job="narwhal-router"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "The router stopped answering its scrape"

      - alert: NarwhalErrorBurst
        expr: sum without (reason) (rate(narwhal_failed_total[5m])) > 0.5
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Requests failing at {{ $value | printf \"%.2f\" }}/s over 5m"
          description: "Inspect terminal errors and attempt_failures in the request journal, then check the named engines and breaker evidence."

      # Each share rule divides by offered requests, which include early refusals and
      # rejections. 0.01 is the 1% at which the dashboard's Dropped headline turns yellow.
      - alert: NarwhalRejectedRising
        expr: sum without (reason) (rate(narwhal_rejected_total[5m])) / rate(narwhal_offered_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "The router rejected {{ $value | humanizePercentage }} of offered requests over 5m"
          description: "Rejected requests alone exceed 1% of offered requests, the share at which the dashboard's Dropped headline turns yellow. Split narwhal_rejected_total by reason: inflight_limit means requests filled the router in-flight limit and serving.queue_capacity, saturated means event-loop lag or request sizing delay reached the saturation threshold, and not_ready means the router was not ready to serve."

      - alert: NarwhalExpiredRising
        expr: sum without (reason) (rate(narwhal_expired_total[5m])) / rate(narwhal_offered_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Deadlines expired {{ $value | humanizePercentage }} of offered requests over 5m"
          description: "Expired requests alone exceed 1% of offered requests, the share at which the dashboard's Dropped headline turns yellow. Split narwhal_expired_total by reason: queue_timeout means the admission wait reached serving.queue_timeout_s, and deadline means serving.request_timeout_s expired. Compare queue depth and wait by stage on the dashboard."

      - alert: NarwhalRetryDeniedRising
        expr: rate(narwhal_retry_denied_total[5m]) / rate(narwhal_offered_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "The retry quota denied retries for {{ $value | humanizePercentage }} of offered requests over 5m"
          description: "A denied retry ends a request the retry policy would otherwise retry, so denials above 1% of offered requests can turn the dashboard's Dropped headline yellow on their own. Check narwhal_retry_credits and narwhal_attempt_failures_total by reason for the failures that consume the quota."

      - alert: NarwhalUnservedRising
        expr: rate(narwhal_unserved_total[10m]) > 0.2
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Request placement exceeds the configured SLO"
          description: "Compare offered demand, pool load, measured profile coverage and controller decisions in /narwhal/state."

      - alert: NarwhalPoolStarved
        expr: narwhal_pool_instances < 1
        for: 2m
        labels:
          severity: warn
        annotations:
          summary: "A pool contains fewer than one engine"

      - alert: NarwhalPrefillBelowFloor
        expr: narwhal_prefill_below_floor > 0
        for: 1m
        labels:
          severity: warn
        annotations:
          summary: "Live prefill capacity is below min_prefill"
          description: "Inspect engine exclusions and controller decisions in /narwhal/state. Predictive admission permits aggregate fallback on an idle decode engine when live prefill capacity reaches zero."

      - alert: NarwhalDecodeBelowFloor
        expr: narwhal_decode_below_floor > 0
        for: 1m
        labels:
          severity: warn
        annotations:
          summary: "Live decode capacity is below min_decode"
          description: "Health exclusions and dwell state can reduce decode capacity below its floor. Check decode_floor.below_floor, decode_floor.restoration_moves, NarwhalEngineEjected, and controller decisions in /narwhal/state."
