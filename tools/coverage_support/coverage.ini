[run]
branch = True
parallel = True
concurrency = multiprocessing,thread
sigterm = False
patch = _exit,execv
source =
    ${NARWHAL_COVERAGE_ROOT}/src/narwhal
    ${NARWHAL_COVERAGE_ROOT}/tools
omit =
    */tools/tests/*
    */tools/drills/*
    */tools/coverage_support/*
    */tools/run_coverage.py
data_file = ${NARWHAL_COVERAGE_DIR}/.coverage
context = ${NARWHAL_COVERAGE_CONTEXT}

[report]
precision = 2
include_namespace_packages = True
exclude_lines =
partial_branches =
