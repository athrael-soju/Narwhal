site_name: Narwhal
site_description: Adaptive hot-swap disaggregation for LLM inference
site_url: https://athrael-soju.github.io/Narwhal/
repo_url: https://github.com/athrael-soju/Narwhal
repo_name: athrael-soju/Narwhal
strict: true

theme:
  name: material
  logo: assets/narwhal.png
  favicon: assets/narwhal.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; athrael-soju

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
