site_name: Narwhal
site_description: Adaptive hot-swap disaggregation for LLM inference
site_url: https://athrael-soju.github.io/Narwhal/
repo_url: https://github.com/athrael-soju/Narwhal
repo_name: athrael-soju/Narwhal
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  logo: assets/narwhal.png
  favicon: assets/narwhal.png
  palette:
    primary: custom
    accent: custom
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; NCA LTD

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Deploy a fleet: Deploy.md
  - Deployment operations:
      - Measure a fleet: Measure.md
      - Set up observability: Observability.md
      - Operate Narwhal: Operate.md
      - Troubleshoot a fleet: Troubleshoot.md
  - Concepts:
      - Core concepts: Core-Concepts.md
  - Reference:
      - Configuration: Configuration.md
      - CLI: CLI-Reference.md
      - HTTP API: HTTP-API.md
      - Telemetry and artifacts: Telemetry-and-Artifacts.md
