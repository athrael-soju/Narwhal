# setuptools 77 is the PEP 639 floor for `license` as an SPDX expression.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Imports as `narwhal`. PyPI holds that distribution name.
name = "narwhal-inference"
version = "0.1.2"
description = "Adaptive hot-swap disaggregation for LLM inference"
readme = "README.md"
authors = [{ name = "Athrael Soju" }]
keywords = [
  "llm", "inference", "disaggregation", "prefill", "decode",
  "scheduling", "vllm", "kv-cache",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

# The engine is not a dependency. Arrow's own implementation note (§5.6) is
# that the scheduler is transparent to the backend: "The only requirement is
# that the inference engine is implemented as stateless and capable of KV
# Cache transmission with any arbitrary instance." So the engine is spoken to
# over HTTP and pinned by digest in the fleet config, never imported.
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.7",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-cov>=5",
  "ruff==0.16.2",
  "mypy==1.19.0",
  "hypothesis==6.150.0",
  "vulture>=2.14",
  "pip-audit>=2.7",
  "pre-commit>=4",
  "build>=1.2",
  "twine>=5",
]
wandb = ["wandb>=0.17"]

[project.scripts]
narwhal-check = "narwhal.check:main"
narwhal-serve = "narwhal.cli:serve"
narwhal-profile = "narwhal.probe:main"
narwhal-bench = "narwhal.bench:main"
narwhal-live-bench = "narwhal.live_bench:main"
narwhal-fleet = "narwhal.fleet:main"
narwhal-report = "narwhal.report:main"

[project.urls]
Repository = "https://github.com/athrael-soju/Narwhal"
Issues = "https://github.com/athrael-soju/Narwhal/issues"

[tool.setuptools.package-data]
narwhal = ["py.typed", "fleet.example.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# D101-D103: every public callable in the package carries a docstring; the
# audit found the gap concentrated exactly where a newcomer enters. S is the
# security register: src carries three deliberate, commented suppressions
# and nothing else.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PERF", "RUF", "S", "PT", "D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
# Standalone drivers: sys.path before import, and long evidence lines.
# The docstring floor and the security register are the package's; harnesses
# and suites assert, fix seeds, and fake credentials by design.
"tools/*.py" = ["E402", "E731", "D", "S"]
"tests/**" = ["D", "S"]
"demo/**" = ["D", "S"]
"examples/**" = ["D", "S"]

[tool.mypy]
python_version = "3.11"
packages = ["narwhal"]
mypy_path = "src"
# The floor: verify what the annotations claim without demanding new ones.
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Optional extra: the exporter guards the import and self-disables without it.
module = "wandb"
ignore_missing_imports = true
disable_error_code = ["import-not-found"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::ResourceWarning"]
