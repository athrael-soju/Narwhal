# setuptools 77 is the PEP 639 floor for `license` as an SPDX expression.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name differs from the import package.
name = "narwhal-inference"
version = "0.6.0"
description = "Adaptive hot-swap disaggregation for LLM inference"
readme = "README.md"
authors = [{ name = "Athrael Soju" }]
keywords = [
  "llm", "inference", "llm-inference", "llm-serving", "disaggregation",
  "disaggregated-inference", "disaggregated-serving", "prefill", "decode",
  "scheduling", "vllm", "kv-cache", "nixl", "gpu", "cuda", "nvidia", "rocm", "amd",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

# Narwhal talks to engines over HTTP and KV transfer.
# Engine builds are pinned in fleet configuration.
dependencies = [
  "fastapi>=0.136.3",
  "httptools>=0.8.0",
  "httpx>=0.28.1",
  "msgpack>=1.2.2",
  "pydantic>=2.13.5",
  "pyzmq>=27.2.0",
  "uvicorn>=0.52.4",
  "uvloop>=0.22.1; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
  "coverage==7.16.1",
  "ruff==0.16.7",
  "mypy==2.3.1",
  "pre-commit>=4",
  "build>=1.2",
  "twine>=5",
]
docs = [
  "mkdocs-material==9.7.7",
  "mkdocs-glightbox==0.5.2",
]

[project.scripts]
narwhal = "narwhal.dev.cli:main"
narwhal-engine = "narwhal.deployment.launch_engine.cli:main"
narwhal-check = "narwhal.diagnostics.check.cli:main"
narwhal-attest = "narwhal.engines.attestation:main"
narwhal-serve = "narwhal.cli:serve"
narwhal-profile = "narwhal.profiling.probe.cli:main"

[project.entry-points."narwhal.backends"]
sglang = "narwhal.backends.sglang:backend"
vllm = "narwhal.backends.vllm:backend"

[project.urls]
Documentation = "https://athrael-soju.github.io/Narwhal/"
Repository = "https://github.com/athrael-soju/Narwhal"
Issues = "https://github.com/athrael-soju/Narwhal/issues"

[tool.setuptools.package-data]
narwhal = ["py.typed", "fleet.example.json"]
"narwhal.dev" = ["small-cuda-v1.json", "reference-v1.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PERF", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# Standalone drivers adjust sys.path and may contain long evidence lines.
# Harnesses use assertions, fixed seeds, and fake credentials.
"tools/*.py" = ["E402", "E731", "S"]
"tests/*.py" = ["E731", "S"]
# Preserve the deployment scripts' lint baseline, including the engine backends' launchers.
"src/narwhal/deployment/*.py" = ["S"]
"src/narwhal/backends/vllm/*.py" = ["S"]
"src/narwhal/backends/sglang/*.py" = ["S"]

[tool.mypy]
python_version = "3.11"
packages = ["narwhal"]
mypy_path = "src"
# Check annotated and unannotated function bodies.
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
