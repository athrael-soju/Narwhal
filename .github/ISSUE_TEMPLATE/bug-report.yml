name: Bug report
description: Something the router, a gate, or a harness did wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what should have happened
      description: One paragraph each. If a request failed, include the HTTP status and any error body.
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: narwhal-check output
      description: Include existing preflight output when available. Remove credentials, live addresses, private paths, and hardware/model identifiers. Run fresh probes only on an idle fleet.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Fleet config, sanitized
      description: Include the SLOs, thresholds, and timeouts from your fleet JSON. Remove credentials, live addresses, private paths, and hardware/model identifiers.
      render: json
  - type: textarea
    id: topology
    attributes:
      label: Topology and required capabilities
      description: Node count, engine count and roles, shared or dedicated device allocation, parallelism sizes, and KV connector. Keep hardware and model identities in private execution records; describe the relevant capability or compatibility constraint here.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: "`pip show narwhal-inference | head -2`, `python --version`, and the engine (vLLM) version. If you have a journal, its first line names the exact build that wrote it."
    validations:
      required: true
