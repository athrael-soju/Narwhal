name: Feature request
description: Propose a change to Narwhal behaviour or operator workflow
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the workload, operator action, or failure that prompts this request.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Desired behaviour
      description: Describe the result, required capabilities, and constraints. Keep the scope hardware/GPU agnostic; hardware and model choices are made when work starts and retained in private execution records.
    validations:
      required: true
  - type: textarea
    id: current-path
    attributes:
      label: Current path
      description: Describe how you handle this today, if applicable.
