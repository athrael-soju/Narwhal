name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Merged release commit to retry. Leave empty to refresh the release PR.'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: narwhal-release
  cancel-in-progress: false
jobs:
  inspect:
    if: >-
      github.repository == 'athrael-soju/Narwhal' &&
      github.ref == 'refs/heads/main' &&
      !github.event.repository.private &&
      vars.NARWHAL_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.candidate.outputs.release }}
      version: ${{ steps.candidate.outputs.version }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - id: identity
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/maintenance/release.py candidate

  build:
    needs: inspect
    if: needs.inspect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]' -c constraints-dev.txt
      - run: make check VENV_PYTHON=python
      - run: python tools/maintenance/release.py check --release
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  smoke:
    needs: [inspect, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Install the wheel without a source checkout
        env:
          EXPECTED_VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          python -m pip install dist/*.whl
          python -c 'import importlib.metadata, os, narwhal; assert importlib.metadata.version("narwhal-inference") == os.environ["EXPECTED_VERSION"]'
          python - <<'PY'
          import importlib.metadata
          import subprocess

          entries = [
              entry for entry in importlib.metadata.distribution("narwhal-inference").entry_points
              if entry.group == "console_scripts"
          ]
          assert entries, "wheel has no console entry points"
          for entry in sorted(entries, key=lambda item: item.name):
              subprocess.run([entry.name, "--help"], check=True, timeout=30)
          print(f"Passed --help for {len(entries)} installed commands")
          PY

  publish:
    needs: [inspect, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Publish the verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          NARWHAL_RELEASES_ENABLED: ${{ vars.NARWHAL_RELEASES_ENABLED }}
        run: python tools/maintenance/release.py publish

  release-pr:
    needs: [inspect, publish]
    if: >-
      always() && needs.inspect.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      !inputs.release_sha &&
      (needs.inspect.outputs.release != 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The first release comes from release/v0.1.0; release-please handles later versions.
      - id: first_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" |
            jq -r 'any(.[][]; .tag_name == "v0.1.0" and .draft == false)')
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.first_release.outputs.published == 'true'
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      - name: Dispatch CI on the release PR
        if: steps.first_release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=release-please--branches--main
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then exit 0; fi
          # Dispatch CI explicitly for the bot-created release PR.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
