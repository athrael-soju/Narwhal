name: wiki
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'tools/publish_wiki.sh'
      - 'tools/check_links.py'
      - '.github/workflows/wiki.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: wiki
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'athrael-soju/Narwhal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publish current main even when this run was queued for an older commit.
          ref: main
          persist-credentials: false
      - name: publish the wiki
        env:
          WIKI_DEPLOY_KEY: ${{ secrets.WIKI_DEPLOY_KEY }}
          WIKI_URL: git@github.com:athrael-soju/Narwhal.wiki.git
        run: |
          set -euo pipefail
          if [ -z "$WIKI_DEPLOY_KEY" ]; then
            echo '::error::Configure WIKI_DEPLOY_KEY with write access to the wiki.'
            exit 1
          fi
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$WIKI_DEPLOY_KEY" > "$key_dir/key"
          chmod 600 "$key_dir/key"
          ssh-keyscan github.com > "$key_dir/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i '$key_dir/key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$key_dir/known_hosts'"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tools/publish_wiki.sh
